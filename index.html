<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameNode | Foro</title>
    <link rel="icon" href="/logo-gamenode.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Exo+2:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background-(--background) text-(--green-neon) relative">
    
    <div class="fixed inset-0 z-[-1] bg-[linear-gradient(rgba(57,255,20,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(57,255,20,0.03)_1px,transparent_1px)] bg-size-[40px_40px] pointer-events-none"></div>
    
    <div class="flex flex-col min-h-screen">
        
        <header id="header-container" class="p-4 md:px-10 border-b border-card-color sticky top-0 z-40 bg-black/80 backdrop-blur-md"></header>

        <main id="main-container" class="flex-1 px-6 md:px-10 w-full max-w-7xl mx-auto">
            <div id="main-grid-container" class="mt-8"></div>
        </main>

        <footer id="footer-container" class="p-6 border-t border-card-color font-ui text-[10px] text-(--green-neon) flex justify-between items-center mt-10 bg-black"></footer>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
