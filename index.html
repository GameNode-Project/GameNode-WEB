<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameNode | Foro</title>
    <link rel="icon" href="/logo-gamenode.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Exo+2:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background-(--background) text-(--green-neon) relative">
    
    <div class="fixed inset-0 z-[-1] bg-[linear-gradient(rgba(57,255,20,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(57,255,20,0.03)_1px,transparent_1px)] bg-size-[40px_40px] pointer-events-none"></div>
    
    <div class="flex min-h-screen">
        
        <aside id="aside-container" class="w-64 border-r border-card-color hidden lg:flex flex-col p-6 sticky top-0 h-screen font-ui"></aside>

        <div class="flex-1 flex flex-col">
            
            <header id="header-container" class="p-6 md:p-10 flex flex-col md:row justify-between items-center gap-6"></header>

            <main id="main-container" class="flex-1 px-6 md:px-10">
                <div id="main-grid-container" class="mt-8"></div>
            </main>

            <footer id="footer-container" class="p-6 border-t border-card-color font-ui text-[10px] text-(--green-neon) flex justify-between items-center mt-10"></footer>
        </div>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
